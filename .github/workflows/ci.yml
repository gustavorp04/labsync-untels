name: Integracion Continua LabSync (CI)

# Se activa cuando alguien envía código (push) o abre un Pull Request a la rama main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # TRABAJO 1: REVISAR EL BACKEND (DJANGO)
  backend-validation:
    runs-on: ubuntu-latest
    
    # Levantamos una base de datos temporal para las pruebas
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: LabSyncUNTELS
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: daniel04
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Copiar código al servidor
      uses: actions/checkout@v3

    - name: Configurar Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar herramientas y dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        cd backend
        pip install -r requirements.txt

    - name: Ejecutar Linter (Limpieza de código)
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=entorno,migrations,__pycache__

    - name: Ejecutar Pruebas de Django
      env:
        # Estas variables activan el bloque PostgreSQL en tu settings.py
        DB_NAME: LabSyncUNTELS
        DB_USER: postgres
        DB_PASSWORD: daniel04
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        cd backend
        python manage.py test

  # TRABAJO 2: REVISAR EL FRONTEND (REACT)
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
    - name: Copiar código al servidor
      uses: actions/checkout@v3

    - name: Configurar Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Instalar y Probar React
      env:
        CI: true # Evita que los tests se queden esperando entrada del usuario
      run: |
        cd frontend
        npm install
        npm run lint --if-present
        npm test -- --passWithNoTests
