name: Continuous Deployment to Staging

on:
  push:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------------------
  # PASO 1: Pruebas con BD local aislada (no usa Supabase)
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Ejecutar pruebas
        run: |
          cd backend
          python manage.py test --verbosity=2

  # -------------------------------------------------------------------------
  # PASO 2: Deploy del backend a Google Cloud Run
  # -------------------------------------------------------------------------
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy labsync-backend \
            --source ./backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --update-env-vars SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --update-env-vars DEBUG="False" \
            --update-env-vars ALLOWED_HOSTS="*" \
            --update-env-vars CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
            --update-env-vars CSRF_TRUSTED_ORIGINS="${{ secrets.CSRF_TRUSTED_ORIGINS }}"

  # -------------------------------------------------------------------------
  # PASO 3: Deploy del frontend a Vercel
  # -------------------------------------------------------------------------
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del frontend
        run: |
          cd frontend
          npm install

      - name: Build del frontend
        env:
          REACT_APP_API_URL: https://labsync-backend-90371338218.us-central1.run.app
        run: |
          cd frontend
          npm run build

      - name: Deploy a Vercel
        run: |
          npm install -g vercel@latest
          vercel --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --cwd ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}