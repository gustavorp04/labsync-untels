

services:
  db:
    image: postgres:15
    container_name: labsync_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=LabSyncUNTELS
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: labsync_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=LabSyncUNTELS
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
      - DATABASE_URL=postgres://postgres:${DB_PASS}@db:5432/LabSyncUNTELS
      - ENABLE_SCHEDULER=true   # ID-10: 1 solo proceso (runserver) → sin duplicados
      - DJANGO_DEBUG=true       # entorno local de desarrollo
      - SECRET_KEY=django-insecure-docker-local-dev-no-usar-en-pro
    command: >
      sh -c "sleep 5 &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload"
    restart: on-failure
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: labsync_frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
